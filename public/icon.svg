<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="widgetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  <rect x="76" y="76" width="360" height="360" rx="72" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="4" filter="url(#shadow)" />
  
  <!-- Mini Widget elements inside icon -->
  <!-- Top bar -->
  <rect x="116" y="120" width="100" height="24" rx="12" fill="url(#widgetGrad)" />
  <circle cx="360" cy="132" r="16" fill="#38bdf8" />

  <!-- Clock & Weather -->
  <text x="116" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="76" font-weight="800" fill="#ffffff" letter-spacing="-2">10:30</text>
  
  <!-- Activity bar -->
  <rect x="116" y="280" width="280" height="16" rx="8" fill="rgba(255,255,255,0.15)" />
  <rect x="116" y="280" width="190" height="16" rx="8" fill="#38bdf8" />

  <!-- Bottom chips -->
  <rect x="116" y="324" width="120" height="44" rx="14" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
  <rect x="252" y="324" width="144" height="44" rx="14" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
  
  <text x="176" y="352" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#38bdf8" text-anchor="middle">72°F</text>
  <text x="324" y="352" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">98%⚡</text>
</svg>
